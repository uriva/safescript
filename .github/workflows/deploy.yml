name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-site:
    name: Test & Deploy safescript.cc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run SafeScript test suite
        run: deno test --allow-all

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build & deploy safescript.cc to Cloudflare Workers
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

  deploy-tank:
    name: Publish Tank Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tank CLI
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            TAG_URL=$(curl -fsSL -o /dev/null -w "%{url_effective}" https://github.com/tankpkg/tank/releases/latest)
            TAG=${TAG_URL##*/}
            if [ -n "$TAG" ]; then
              curl -fsSL "https://github.com/tankpkg/tank/releases/download/${TAG}/tank-linux-x64" -o tank
              curl -fsSL "https://github.com/tankpkg/tank/releases/download/${TAG}/SHA256SUMS" -o SHA256SUMS
              EXPECTED_SUM=$(awk -v name="tank-linux-x64" '$2==name { print $1 }' SHA256SUMS)
              ACTUAL_SUM=$(sha256sum tank | awk '{print $1}')
              if [ "$EXPECTED_SUM" = "$ACTUAL_SUM" ]; then
                sudo mv tank /usr/local/bin/tank
                sudo chmod +x /usr/local/bin/tank
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish to Tank Registry
        env:
          TANK_TOKEN: ${{ secrets.TANK_TOKEN }}
        run: |
          set +e
          output=$(tank publish 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            if echo "$output" | grep -q "Version already exists"; then
              echo "Version already exists. Skipping."
              exit 0
            else
              exit $exit_code
            fi
          fi
